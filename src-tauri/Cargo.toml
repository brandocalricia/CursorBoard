[package]
name = "high-dashboard"
version = "0.1.0"
description = "High Dashboard — local personal command center"
authors = ["High Dashboard"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "high_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
